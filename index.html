
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLAYZONE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b14;color:white;font-family:Arial,sans-serif;padding:22px}
h1{text-align:center;color:#a78bfa;font-size:38px}
p{text-align:center;color:#aaa}
input{width:100%;padding:15px;border-radius:12px;border:1px solid #444;background:#171b2c;color:white;font-size:16px}
nav{display:flex;justify-content:center;gap:10px;margin:20px 0;flex-wrap:wrap}
button{padding:11px 17px;border:0;border-radius:10px;background:#7654e8;color:white;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:13px;margin-top:20px}
.card{background:#171b2c;border:1px solid #343a50;border-radius:15px;padding:18px;text-align:center}
.card a{color:#b9a4ff;text-decoration:none;font-weight:bold}
.card h3{margin:10px 0}
</style>
</head>
<body>
<h1>🎮 PLAYZONE</h1>
<p>Games, movies & entertainment</p>

<input id="search" placeholder="🔎 Search games and movies...">

<nav>
<button onclick="show('all')">All</button>
<button onclick="show('game')">Games</button>
<button onclick="show('movie')">Movies</button>
</nav>

<div class="grid" id="grid">
<div class="card" data-type="game">
<h2>🧩</h2><h3>Coolmath Games</h3>
<a href="https://www.coolmathgames.com/">Play ↗</a>
</div>
<div class="card" data-type="game">
<h2>🐱</h2><h3>Scratch</h3>
<a href="https://scratch.mit.edu/">Play ↗</a>
</div>
<div class="card" data-type="game">
<h2>🎨</h2><h3>PBS Kids</h3>
<a href="https://pbskids.org/games">Play ↗</a>
</div>
<div class="card" data-type="game">
<h2>👾</h2><h3>itch.io</h3>
<a href="https://itch.io/games/html5">Explore ↗</a>
</div>
<div class="card" data-type="movie">
<h2>🍿</h2><h3>Tubi</h3>
<a href="https://tubitv.com/">Watch ↗</a>
</div>
<div class="card" data-type="movie">
<h2>📺</h2><h3>Pluto TV</h3>
<a href="https://pluto.tv/">Watch ↗</a>
</div>
<div class="card" data-type="movie">
<h2>🎬</h2><h3>Kanopy</h3>
<a href="https://www.kanopy.com/">Explore ↗</a>
</div>
</div>

<script>
function show(type){
document.querySelectorAll('.card').forEach(card=>{
card.style.display=type==='all'||card.dataset.type===type?'block':'none';
});
}
document.getElementById('search').addEventListener('input',e=>{
let q=e.target.value.toLowerCase();
document.querySelectorAll('.card').forEach(card=>{
card.style.display=card.innerText.toLowerCase().includes(q)?'block':'none';
});
});
</script>
</body>
</html>
